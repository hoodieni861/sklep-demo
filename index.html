:root{--bg:#F4C9D6;color-scheme:light}

.shop{background:transparent}

.nb-toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.nb-toast.err{background:#8C1D18}
.nb-toast a{color:#F7B6D4;margin-left:10px;white-space:nowrap}

.shop .demo-bar a{text-decoration:underline}

.shop{
  --pink:#F7B6D4; --pink-soft:#FDF0F5; --pink-mid:#F9D3E3; --pink-ink:#B4648A;
  --grey:#F5F3F2; --grey-2:#ECE8E6; --line:#E8E2E0;
  --coffee:#6A4836; --coffee-soft:#F6EFEA;
  --ink:#1E1A1B; --muted:#6F6769; --white:#fff;
  --ok:#2F7D55; --warn:#B26A00; --err:#B3261E;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --radius:4px; --wrap:1200px;
}
.shop *,.shop{box-sizing:border-box}
.shop{-webkit-text-size-adjust:100%}
.shop{margin:0;background:var(--white);color:var(--ink);font:400 15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.shop img{max-width:100%;display:block}
.shop a{color:inherit}
.shop h1,.shop h2,.shop h3,.shop h4{font-family:var(--serif);font-weight:400;line-height:1.2;margin:0 0 .5em;letter-spacing:-.005em}
.shop h1{font-size:clamp(30px,4.2vw,48px)}
.shop h2{font-size:clamp(25px,3vw,36px)}
.shop h3{font-size:21px}
.shop p{margin:0 0 1em}
.shop .wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.shop .eyebrow{font:500 11.5px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:block}
.shop .muted{color:var(--muted)}
.shop .center{text-align:center}
.shop .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shop :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.shop .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 28px;border:1px solid var(--ink);
  background:var(--ink);color:#fff;font:500 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;
  border-radius:var(--radius);cursor:pointer;transition:background .15s,color .15s}
.shop .btn:hover{background:#3a3335}
.shop .btn svg{width:18px;height:18px;flex:none}
.shop .btn-outline{background:transparent;color:var(--ink)}
.shop .btn-outline:hover{background:var(--ink);color:#fff}
.shop .btn-light{background:#fff;color:var(--ink);border-color:#fff}
.shop .btn-light:hover{background:var(--pink-soft)}
.shop .btn-coffee{background:var(--coffee);border-color:var(--coffee)}
.shop .btn-coffee:hover{background:#563a2b}
.shop .btn-block{width:100%}
.shop .btn-sm{min-height:38px;padding:0 16px;font-size:12px}
.shop .btn[disabled]{opacity:.45;cursor:not-allowed}
.shop .link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}
.shop .demo-bar{background:#2b2b2b;color:#fff;text-align:center;font-size:12.5px;padding:7px 12px}
.shop .announce{background:var(--pink);color:var(--ink);text-align:center;font-size:12.5px;letter-spacing:.06em;padding:8px 12px}
.shop .site-header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.shop .header-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;height:76px}
.shop .logo img{height:44px;width:auto}
.shop .nav{display:flex;justify-content:center;gap:26px}
.shop .nav a{text-decoration:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;white-space:nowrap}
.shop .nav a:hover,.shop .nav a.active{border-color:var(--ink)}
.shop .nav a.coffee-link{color:var(--coffee)}
.shop .icons{display:flex;gap:6px;align-items:center}
.shop .icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer}
.shop .icon-btn:hover{background:var(--grey)}
.shop .icon-btn svg{width:22px;height:22px}
.shop .badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:var(--ink);font:600 11px/18px var(--sans);text-align:center}
.shop .menu-toggle{display:none}
@media (max-width:1080px){.shop .nav{gap:18px}
.shop .nav a{font-size:12px}}
@media (max-width:960px){.shop .header-in{grid-template-columns:auto 1fr auto;height:64px;gap:8px}
.shop .menu-toggle{display:inline-flex}
.shop .logo{justify-self:center}
.shop .logo img{height:34px}
.shop .nav{position:fixed;inset:64px 0 0 0;background:#fff;flex-direction:column;justify-content:flex-start;gap:0;padding:12px 20px 40px;
    transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto;z-index:39}
.shop .nav.open{transform:none}
.shop .nav a{font-size:15px;padding:16px 0;border-bottom:1px solid var(--line)}
.shop .nav a:hover,.shop .nav a.active{border-color:var(--line)}
.shop.menu-open{overflow:hidden}}
.shop .flashes{max-width:var(--wrap);margin:16px auto 0;padding:0 20px}
.shop .flash{padding:12px 16px;border-radius:var(--radius);margin-bottom:8px;font-size:14px;border:1px solid}
.shop .flash-success{background:#EEF7F1;border-color:#CBE6D5;color:#1F5A3B}
.shop .flash-error{background:#FCEEEE;border-color:#F2CACA;color:#8C1D18}
.shop .flash-info{background:var(--pink-soft);border-color:var(--pink-mid);color:var(--ink)}
.shop .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:14px 20px;border-radius:var(--radius);
  font-size:14px;z-index:60;transition:.2s;display:flex;gap:16px;align-items:center;max-width:calc(100% - 32px)}
.shop .toast.show{opacity:1;transform:translateX(-50%)}
.shop .toast a{color:var(--pink);white-space:nowrap}
.shop .section{padding:84px 0}
.shop .section-sm{padding:56px 0}
.shop .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.shop .section-head p{margin:0;color:var(--muted);max-width:520px}
.shop .bg-grey{background:var(--grey)}
.shop .bg-pink{background:var(--pink-soft)}
@media (max-width:720px){.shop .section{padding:56px 0}
.shop .section-sm{padding:40px 0}}
.shop .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px}
.shop .grid-3{grid-template-columns:repeat(3,1fr)}
@media (max-width:1000px){.shop .grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.shop .grid,.shop .grid-3{grid-template-columns:repeat(2,1fr);gap:24px 14px}}
.shop .card{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.shop .card-media{position:relative;aspect-ratio:4/5;background:var(--grey);overflow:hidden;border-radius:var(--radius)}
.shop .card-media img{width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.shop .card-media .img2{position:absolute;inset:0;opacity:0}
.shop .card:hover .card-media .img2{opacity:1}

.adm .muted{color:var(--muted)}
.adm .empty{padding:30px;text-align:center;color:var(--muted)}
.adm .check-list{list-style:none;padding:0;margin:0}
.adm .check-list li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.adm .check-list li:last-child{border:0}
.adm .check-list .ic{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.adm .check-list .ok .ic{background:#E6F3EB;color:var(--ok)}
.adm .check-list .no .ic{background:#FFF4E0;color:var(--warn)}
.adm .sticky-save{position:sticky;bottom:0;background:rgba(247,245,244,.96);padding:14px 0;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;z-index:5;margin-top:10px}
.adm .img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.adm .img-item{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;position:relative}
.adm .img-item img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;background:var(--bg)}
.adm .img-item input{height:32px;font-size:12.5px;margin-top:6px}
.adm .img-item .ph{position:absolute;top:12px;left:12px;background:#9A5B00;color:#fff;font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:3px;letter-spacing:.03em}
.adm .img-item .first{position:absolute;top:12px;right:12px;background:var(--ink);color:#fff;font-size:10.5px;padding:3px 6px;border-radius:3px}
.adm .drop{border:2px dashed #d8d0d2;border-radius:8px;padding:20px;text-align:center;color:var(--muted);background:#fff;cursor:pointer;display:block;font-weight:400}
.adm .drop:hover{border-color:var(--ink)}
.adm .drop input{display:none}
.adm .vt input{min-width:70px}
.adm .editor{border:1px solid #d8d0d2;border-radius:var(--r);background:#fff}
.adm .editor .tb{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:0;background:#fff;border-radius:var(--r) var(--r) 0 0}
.adm .editor .tb button{height:30px;min-width:32px;padding:0 8px;border:0;background:none;border-radius:4px;cursor:pointer;font:500 13px "Inter",sans-serif;color:var(--ink)}
.adm .editor .tb button:hover{background:var(--bg)}
.adm .editor .area{min-height:220px;padding:14px 16px;outline:none;font-size:15px;line-height:1.65}
.adm .editor .area h2{font:400 22px "Lora",serif;margin:1em 0 .4em}
.adm .editor .area h3{font:400 18px "Lora",serif;margin:1em 0 .4em}
.adm .editor .area p{margin:0 0 .8em}
.adm .editor.big .area{min-height:420px}
.adm .preview-img{width:100%;max-width:320px;max-height:180px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg);display:block;margin-bottom:8px}
.adm .preview-img.logo{object-fit:contain;padding:10px;max-height:80px}
.adm .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.adm .tabs a{padding:7px 12px;border-radius:20px;border:1px solid var(--line);text-decoration:none;font-size:13px;background:#fff}
.adm .tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.adm .login{max-width:400px;margin:10vh auto;padding:0 16px}
.adm .login .card{padding:32px}
.adm .login img{height:44px;margin:0 auto 20px;display:block}
.adm .toc a{display:block;padding:4px 0;font-size:14px}
.adm .help h2{font:400 22px "Lora",serif;margin:28px 0 10px;scroll-margin-top:20px}
.adm .help ol li,.adm .help ul li{margin-bottom:6px}
.adm .help .tip{background:var(--pink-soft);border-radius:8px;padding:12px 14px;margin:10px 0}
.adm .log li{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);list-style:none}
.adm .log{padding:0;margin:0}
.adm code{background:var(--bg);padding:1px 5px;border-radius:3px;font-size:13px}
.shop{background:transparent}</style>

żyć, daty, minimalne zamówienie, darmowa dostawa → <strong>Zapisz kod</strong>. Klientki wpisują go w koszyku.</p>\n<h2>6. Zamówienia</h2><p>Pulpit → <strong>Do wysłania</strong>. Otwórz zamówienie, nadaj paczkę u przewoźnika, wpisz numer przesyłki i ustaw status <strong>Wysłane</strong>. <strong>Anulowane</strong> zwraca produkty na magazyn.</p>\n<h2>7. Coming Soon (zapowiedź)</h2><p>Teksty zapowiedzi zmienisz w <strong>Treści strony → Coming Soon</strong>. Po premierze dodaj produkt (np. e-book), a potem wpisz jego adres w polu „Po premierze: adres produktu” – zakładka i kafelek zaczną prowadzić do jego strony sprzedażowej. Aby ukryć zapowiedź, odznacz „Pokazuj zapowiedź”.</p>\n<h2>O tej wersji</h2><p>Ta wersja działa na claude.ai: wszystkie zmiany w panelu zapisują się w bazie i są od razu widoczne w sklepie. Płatności są tu symulowane. Pełny sklep z Przelewy24, e-mailami i własną domeną jest w paczce <code>nastella-sklep.zip</code> (instrukcja wdrożenia w README).</p>";</script>

    if (['settings', 'products', 'stock', 'categories', 'shipping', 'pages', 'discounts'].every(function (k) { return S.loaded[k]; })) { S.loaded.ready = true; render(true); }
  }
  async function start() {
    render(true);
    if (!window.claude || !window.claude.use) { offline = 'Otwórz tę stronę na claude.ai, aby zobaczyć działający sklep.'; render(true); return; }
    db = await window.claude.use('db');
    if (!db) { offline = 'Zaloguj się do Claude, aby zobaczyć sklep.'; render(true); return; }
    user = await window.claude.use('user');
    try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
    isAdmin = user ? await user.canEdit() : false;
    if (isAdmin) { try { assets = await window.claude.use('assets'); } catch (e) { assets = null; } }
    db.doc('shop/settings').onSnapshot(function (s) { S.settings = s.exists ? Object.assign({}, s.data()) : {}; S.loaded.settings = true; maybeReady(); scheduleRender(); }, function () { S.loaded.settings = true; maybeReady(); });
    listen('products', 'products');
    db.collection('stock').onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); S.stock = o; S.loaded.stock = true; maybeReady(); scheduleRender(); }, function () { S.loaded.stock = true; maybeReady(); });
    listen('categories', 'categories'); listen('shipping', 'shipping'); listen('pages', 'pages'); listen('discounts', 'discounts');
    db.collection('discountUses').onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); S.uses = o; scheduleRender(); }, function () {});
    if (uid) db.doc('orders/' + uid).onSnapshot(function (s) { S.my = s.exists ? s.data() : {}; scheduleRender(); }, function () {});
    if (isAdmin) { listen('orders', 'orders'); listen('trainings', 'trainings'); }
    setTimeout(function () { if (!S.loaded.ready) { S.loaded.ready = true; render(true); } }, 8000);
  }
  start();
})();
</script>
